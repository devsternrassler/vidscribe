services:
  vidscribe-service:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VIDSCRIBE_API_TOKEN: ${VIDSCRIBE_API_TOKEN:?set VIDSCRIBE_API_TOKEN}
      XDG_CACHE_HOME: /data/cache
      UV_CACHE_DIR: /data/cache/uv
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - vidscribe_data:/data
    tmpfs:
      - /tmp:size=3G,mode=1777
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 6G

volumes:
  vidscribe_data:
